# ===============================
# = DATA SOURCE (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:10.162.150.105}:${MYSQL_PORT:3306}/${MYSQL_DB:payment_service}?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ===============================
# = KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_HOST:10.162.150.105}:${KAFKA_PORT:9092}

# Producer settings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.topic-json.name=payments

# Logging
logging.level.com.example=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Transaction timeout
spring.transaction.default-timeout=30

# Actuator for monitoring
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

server.port=9090
